<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0d0f1a">
  <title>Study deck</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/card.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <button class="waffle" id="waffle" aria-haspopup="menu" aria-expanded="false" aria-label="Choose a deck">
        <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
      </button>
      <div class="title" id="title"></div>
      <div class="count" id="count" aria-live="polite"></div>
      <button class="shuffle" id="shuffle" aria-pressed="false" aria-label="Shuffle the deck order" title="Shuffle after this card">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="m4 4 5 5"/></svg>
      </button>
      <div class="menu" id="menu" role="menu" hidden></div>
    </header>

    <section class="stage" id="stage" aria-label="Flashcard">
      <div class="ghost g3"></div>
      <div class="ghost g2"></div>
      <div class="ghost g1"></div>
      <article class="card" id="card">
        <div class="flipper" id="flipper">
          <div class="face front"><div class="figure"></div><p class="text"></p><p class="sub"></p><div class="options"></div></div>
          <div class="face back"><div class="figure"></div><p class="text"></p><p class="sub"></p><div class="options"></div></div>
        </div>
      </article>
    </section>

    <footer class="bottom">
      <div class="sides" id="sides" aria-hidden="true"></div>
    </footer>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
