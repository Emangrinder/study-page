<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0d0f1a">
  <title>Study deck</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/card.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <button class="waffle" id="waffle" aria-haspopup="menu" aria-expanded="false" aria-label="Choose a deck">
        <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
      </button>
      <div class="title" id="title"></div>
      <div class="count" id="count" aria-live="polite"></div>
      <button class="shuffle search-btn" id="search-btn" aria-label="Find a card" title="Find a card">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
      <button class="shuffle" id="shuffle" aria-pressed="false" aria-label="Shuffle the deck order" title="Shuffle after this card">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="m4 4 5 5"/></svg>
      </button>
      <div class="menu" id="menu" role="menu" hidden></div>
      <div class="menu searchbox" id="search" hidden>
        <input id="q" type="search" placeholder="Find a card in this deck" autocomplete="off" enterkeyhint="search">
        <div id="hits"></div>
      </div>
    </header>

    <section class="stage" id="stage" aria-label="Flashcard">
      <div class="ghost g3"></div>
      <div class="ghost g2"></div>
      <div class="ghost g1"></div>
      <article class="under" id="under" aria-hidden="true">
        <div class="face"><div class="figure"></div><p class="head"></p><p class="text"></p><p class="extra"></p><p class="sub"></p><pre class="code"></pre><div class="options"></div></div>
      </article>
      <article class="card" id="card">
        <i class="tapzone" aria-hidden="true"></i>
        <div class="flipper" id="flipper">
          <i class="slab lip"></i><i class="slab" style="--z:-3px"></i><i class="slab" style="--z:-2px"></i><i class="slab" style="--z:-1px"></i><i class="slab" style="--z:0px"></i><i class="slab" style="--z:1px"></i><i class="slab" style="--z:2px"></i><i class="slab" style="--z:3px"></i>
          <div class="face front"><div class="figure"></div><p class="head"></p><p class="text"></p><p class="extra"></p><p class="sub"></p><pre class="code"></pre><div class="options"></div></div>
          <div class="face back"><div class="figure"></div><p class="head"></p><p class="text"></p><p class="extra"></p><p class="sub"></p><pre class="code"></pre><div class="options"></div></div>
        </div>
      </article>
    </section>

    <footer class="bottom">
      <button class="fadebtn" id="fadebtn" aria-label="Caption fade-in delay. Tap for instant, hold to set the delay, hold over 3 seconds for never" title="Hold to set how long until the small caption fades in"><span id="fadeval">0</span></button>
      <div class="sides" id="sides" aria-hidden="true"></div>
    </footer>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
